# Trino for insights beside basedb (the `trino` service of docker-compose.yml, profile
# `insights`). The three files of this folder are insights' own (docker/trino/etc in its
# repository): keep them in step with it.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Catalogues ajoutés à chaud par l'API (CREATE CATALOG) ; l'application reste la source de vérité.
catalog.management=dynamic
catalog.store=memory
query.max-memory=1GB
query.max-memory-per-node=1GB
