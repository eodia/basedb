name: Publier l’image Docker

# The basedb image — the API, the MCP server and the interface in one — on Docker Hub,
# eodia/basedb: a `v0.1.1` tag publishes 0.1.1, 0.1 and latest; a prerelease
# (`v0.2.0-rc.1`) publishes its exact version only. For amd64 and arm64 (emulated).
on:
  push:
    tags:
      - 'v*'
  # By hand, from a `v*` tag: publishes that version again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # An installation records, for each catalog migration, its checksum and the version
      # that applied it: a migration published unsealed could still change afterwards, and
      # every installation that applied it would then refuse to start. See
      # scripts/catalog-migrations.mjs.
      - name: Vérifier les migrations de catalogue et la version
        run: |
          set -euo pipefail
          node scripts/catalog-migrations.mjs check --release
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          if ! grep -q "APPLICATION_VERSION = '$version'" packages/core/src/catalog/cache.ts; then
            echo "::error::APPLICATION_VERSION (packages/core/src/catalog/cache.ts) doit valoir '$version' pour l’étiquette $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Lancez ce workflow depuis une étiquette vX.Y.Z (reçu : $GITHUB_REF_NAME)."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tags=(--tag "eodia/basedb:$version")
          if [[ -z "${BASH_REMATCH[4]}" ]]; then
            tags+=(--tag "eodia/basedb:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" --tag eodia/basedb:latest)
          fi

          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.title=basedb" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --push
