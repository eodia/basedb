# basedb — PostgreSQL and basedb (the API, the MCP server and the interface in one image).
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD and BASEDB_ENCRYPTION_KEY
#   docker compose up -d        # pulls eodia/basedb; `--build` builds it from this clone
#   docker compose logs basedb  # the administrator's password, printed once
#
# Everything on http://localhost:3000 — the interface, the API under /api, the MCP server
# under /mcp — published on 127.0.0.1 only. To serve it on a domain with HTTPS (Caddy,
# automatic certificates):
#
#   docker compose --profile https up -d               # with BASEDB_DOMAIN set in .env
#
# Every variable is described in `.env.example`. An empty value counts as unset.

name: basedb

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basedb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-basedb}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published for psql and your SQL tools: basedb's tables are plain PostgreSQL tables.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during initdb the image runs a temporary server on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30

  basedb:
    image: eodia/basedb:${BASEDB_VERSION:-latest}
    build: { context: . }
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-basedb}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-basedb}}
      BASEDB_ENCRYPTION_KEY: ${BASEDB_ENCRYPTION_KEY:?set BASEDB_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      BASEDB_TENANT: ${BASEDB_TENANT:-}
      # Applies the catalog on an empty database and creates the first administrator;
      # both are no-ops on the next starts.
      BASEDB_MIGRATE: ${BASEDB_MIGRATE:-1}
      BASEDB_BOOTSTRAP: ${BASEDB_BOOTSTRAP:-1}
      BASEDB_ADMIN_EMAIL: ${BASEDB_ADMIN_EMAIL:-}
      BASEDB_ADMIN_PASSWORD: ${BASEDB_ADMIN_PASSWORD:-}
      # The public address, for the return of an OIDC sign-in and the links basedb gives.
      BASEDB_PUBLIC_URL: ${BASEDB_PUBLIC_URL:-}
      BASEDB_ORIGINS: ${BASEDB_ORIGINS:-}
      # Files of `file` and `image` fields: the /data volume, or an S3-compatible store.
      BASEDB_FILES_MAX_MB: ${BASEDB_FILES_MAX_MB:-}
      BASEDB_S3_BUCKET: ${BASEDB_S3_BUCKET:-}
      BASEDB_S3_ENDPOINT: ${BASEDB_S3_ENDPOINT:-}
      BASEDB_S3_REGION: ${BASEDB_S3_REGION:-}
      BASEDB_S3_ACCESS_KEY_ID: ${BASEDB_S3_ACCESS_KEY_ID:-}
      BASEDB_S3_SECRET_ACCESS_KEY: ${BASEDB_S3_SECRET_ACCESS_KEY:-}
      BASEDB_S3_FORCE_PATH_STYLE: ${BASEDB_S3_FORCE_PATH_STYLE:-}
      # AI: provider, model and key for the instance (a tenant's settings win).
      BASEDB_AI_PROVIDER: ${BASEDB_AI_PROVIDER:-}
      BASEDB_AI_MODEL: ${BASEDB_AI_MODEL:-}
      BASEDB_AI_API_KEY: ${BASEDB_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      BASEDB_AI_QUOTA: ${BASEDB_AI_QUOTA:-}
      BASEDB_AI_FIELD_QUOTA: ${BASEDB_AI_FIELD_QUOTA:-}
      BASEDB_AI_WORKER: ${BASEDB_AI_WORKER:-}
      # Where the base templates' catalog is read — the public site by default, `off` for none.
      BASEDB_TEMPLATES_URL: ${BASEDB_TEMPLATES_URL:-}
      # Development only.
      BASEDB_DEV_MAIL: ${BASEDB_DEV_MAIL:-}
      BASEDB_WEBHOOK_DEV: ${BASEDB_WEBHOOK_DEV:-}
    volumes:
      - files:/data
    ports:
      - "127.0.0.1:${BASEDB_PORT:-3000}:3000"

  # One domain, HTTPS by Let's Encrypt, in front of basedb — which does its own routing.
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [basedb]
    # BASEDB_DOMAIN: the domain, whose DNS points here, ports 80 and 443 reachable.
    command: caddy reverse-proxy --from ${BASEDB_DOMAIN:-localhost} --to basedb:3000
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
