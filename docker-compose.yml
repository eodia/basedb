# basedb — the whole stack: PostgreSQL, the API, the MCP entry point, the interface.
#
#   cp .env.example .env        # then set POSTGRES_PASSWORD and BASEDB_ENCRYPTION_KEY
#   docker compose up -d --build
#   docker compose logs api     # the administrator's password, printed once
#
# Interface on http://localhost:3000, API on :8787, MCP on :8788/mcp — published on
# 127.0.0.1 only. To serve it on a domain with HTTPS (Caddy, automatic certificates):
#
#   docker compose --profile https up -d --build     # with BASEDB_DOMAIN set in .env
#
# Every variable is described in `.env.example`. An empty value counts as unset.

name: basedb

x-kernel: &kernel
  # The API and the MCP server share the database and the instance key: what one seals,
  # the other must open.
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-basedb}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-basedb}}
  BASEDB_ENCRYPTION_KEY: ${BASEDB_ENCRYPTION_KEY:?set BASEDB_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
  BASEDB_TENANT: ${BASEDB_TENANT:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basedb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-basedb}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published for psql and your SQL tools: basedb's tables are plain PostgreSQL tables.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during initdb the image runs a temporary server on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., target: api }
    image: basedb-api
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *kernel
      # Applies the catalog on an empty database and creates the first administrator;
      # both are no-ops on the next starts.
      BASEDB_MIGRATE: ${BASEDB_MIGRATE:-1}
      BASEDB_BOOTSTRAP: ${BASEDB_BOOTSTRAP:-1}
      BASEDB_ADMIN_EMAIL: ${BASEDB_ADMIN_EMAIL:-}
      BASEDB_ADMIN_PASSWORD: ${BASEDB_ADMIN_PASSWORD:-}
      # Addresses, as the browser sees them.
      BASEDB_ORIGINS: ${BASEDB_ORIGINS:-}
      BASEDB_PUBLIC_URL: ${BASEDB_PUBLIC_URL:-}
      # Files of `file` and `image` fields: the /data volume, or an S3-compatible store.
      BASEDB_FILES_MAX_MB: ${BASEDB_FILES_MAX_MB:-}
      BASEDB_S3_BUCKET: ${BASEDB_S3_BUCKET:-}
      BASEDB_S3_ENDPOINT: ${BASEDB_S3_ENDPOINT:-}
      BASEDB_S3_REGION: ${BASEDB_S3_REGION:-}
      BASEDB_S3_ACCESS_KEY_ID: ${BASEDB_S3_ACCESS_KEY_ID:-}
      BASEDB_S3_SECRET_ACCESS_KEY: ${BASEDB_S3_SECRET_ACCESS_KEY:-}
      BASEDB_S3_FORCE_PATH_STYLE: ${BASEDB_S3_FORCE_PATH_STYLE:-}
      # AI: provider, model and key for the instance (a tenant's settings win).
      BASEDB_AI_PROVIDER: ${BASEDB_AI_PROVIDER:-}
      BASEDB_AI_MODEL: ${BASEDB_AI_MODEL:-}
      BASEDB_AI_API_KEY: ${BASEDB_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      BASEDB_AI_QUOTA: ${BASEDB_AI_QUOTA:-}
      BASEDB_AI_FIELD_QUOTA: ${BASEDB_AI_FIELD_QUOTA:-}
      BASEDB_AI_WORKER: ${BASEDB_AI_WORKER:-}
      # Where the base templates' catalog is read — the public site by default, `off` for none.
      BASEDB_TEMPLATES_URL: ${BASEDB_TEMPLATES_URL:-}
      # Development only.
      BASEDB_DEV_MAIL: ${BASEDB_DEV_MAIL:-}
      BASEDB_WEBHOOK_DEV: ${BASEDB_WEBHOOK_DEV:-}
    volumes:
      - files:/data
    ports:
      - "127.0.0.1:${BASEDB_API_PORT:-8787}:8787"

  mcp:
    build: { context: ., target: mcp }
    image: basedb-mcp
    restart: unless-stopped
    init: true
    depends_on:
      # The API applies the catalog; the MCP server only reads and writes through it.
      api: { condition: service_healthy }
    environment:
      <<: *kernel
    ports:
      - "127.0.0.1:${BASEDB_MCP_PORT:-8788}:8788"

  web:
    build: { context: ., target: web }
    image: basedb-web
    restart: unless-stopped
    init: true
    depends_on:
      api: { condition: service_healthy }
    # The interface holds no secret: it is told where the API and the MCP server are.
    environment:
      BASEDB_API: ${BASEDB_API:-http://localhost:${BASEDB_API_PORT:-8787}}
      BASEDB_MCP: ${BASEDB_MCP:-http://localhost:${BASEDB_MCP_PORT:-8788}/mcp}
    ports:
      - "127.0.0.1:${BASEDB_WEB_PORT:-3000}:3000"

  # One domain, HTTPS by Let's Encrypt: /api, /auth → API; /mcp → MCP; the rest → web.
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [api, mcp, web]
    environment:
      BASEDB_DOMAIN: ${BASEDB_DOMAIN:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
