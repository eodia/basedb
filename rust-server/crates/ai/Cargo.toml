[package]
name = "basedb-ai"
description = "L'IA : copilote, champs IA, fournisseurs, pièces jointes, documents PDF."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "basedb_ai"

[dependencies]
basedb_contracts.workspace = true
basedb_base.workspace = true
basedb_catalog.workspace = true
basedb_records.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-postgres.workspace = true
reqwest.workspace = true
chrono.workspace = true
regex.workspace = true
base64.workspace = true
bytes.workspace = true
uuid.workspace = true
indexmap.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
url.workspace = true
futures-util.workspace = true
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
flate2 = "1"
lopdf = { version = "0.47", default-features = false }
aes-gcm = "0.10"
rustybuzz = "0.7"
ttf-parser = "0.18"
png = "0.17"
subsetter = { version = "0.2.6", default-features = false }
